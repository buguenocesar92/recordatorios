; Endurecimiento defensivo — CVE-2026-109618 / CVE-2026-109619 (PHP2Shell).
;
; Esto NO es el parche: el parche es el intérprete (PHP 8.5.12), y llega con la
; imagen base que este repositorio ya fija por versión exacta. Lo que va acá es
; la capa que cierra el vector de explotación y que, además, sigue sirviendo
; después: son ajustes que nadie tiene que acordarse de mantener.
;
; «session.upload_progress.enabled = Off» es la mitigación CONFIRMADA de
; CVE-2026-109619 (uso fuera de límites en «php_session_rfc1867_callback»): sin
; la clave de sesión «PHP_SESSION_UPLOAD_PROGRESS» el atacante no tiene contra
; qué escribir. La aplicación no la usa.

; «fatal_error_backtraces = 0» (directiva de PHP 8.5): un error fatal deja de
; devolver la traza interna al cliente.

; «memory_limit = -1» saca el límite de memoria de PHP del medio: el tope real
; pasa a ser el «mem_limit» del compose (la frontera del cgroup), y PHP no mata
; al worker antes que el cgroup. OJO: este fichero se carga antes que
; «zz-seguridad.ini», así que cualquier ajuste que ese fichero declare sobre
; «memory_limit» manda sobre el de acá.

session.upload_progress.enabled = Off
fatal_error_backtraces = 0
memory_limit = -1
