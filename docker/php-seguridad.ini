; Ajustes de PHP que no dependen del proyecto sino de no regalar información.
;
; expose_php añade a cada respuesta una cabecera «X-Powered-By: PHP/8.5.8». No es
; una vulnerabilidad por sí sola, pero le entrega a cualquiera la versión exacta
; del intérprete: quien busque un objetivo con una falla conocida de esa versión
; no tiene que probar nada, la lee en la respuesta. No cuesta nada quitarlo.
expose_php = Off

; Cuánto pesa lo que se puede subir.
;
; Sin estas dos líneas rige el valor de fábrica de PHP —2 MB—, y una foto de
; teléfono pesa entre 8 y 12. Subirla fallaba siempre, y en silencio: PHP
; descarta el archivo y la aplicación ve el campo vacío, así que el formulario
; se queda esperando algo que nunca llegó y nadie sabe por qué.
;
; «post_max_size» va por encima de «upload_max_filesize» a propósito: el envío
; lleva el archivo MÁS el resto del formulario, y si quedaran iguales, subir un
; archivo del tamaño máximo fallaría por unos pocos bytes de campos de texto.
upload_max_filesize = 20M
post_max_size = 24M

; Medición de cobertura: instalada pero APAGADA.
;
; Encenderla cuesta tiempo en cada petición, y en producción no mide nada útil.
; Las pruebas la encienden cuando la necesitan: php -d pcov.enabled=1
pcov.enabled = 0
