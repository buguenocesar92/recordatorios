# Configuración del escáner de secretos.
#
# Parte de las reglas por defecto de gitleaks y solo agrega excepciones para
# lo que NO es una credencial: ejemplos de documentación y datos de prueba.
# La lista se mantiene corta a propósito: cada excepción es un lugar donde el
# escáner deja de mirar.
[extend]
useDefault = true

[allowlist]
description = "Ejemplos de documentación y valores ficticios de las pruebas"
paths = [
    # Las skills y los planes de trabajo llevan ejemplos de credenciales dentro
    # del texto: son material de lectura, no configuración que se ejecute.
    '''\.claude/skills/''',
    # Las skills que instala Laravel Boost (`.agents/skills/`) son el mismo
    # material que las de `.claude/skills/`: guías con ejemplos de un `.env`
    # comprometido (STRIPE_SECRET=… en laravel-best-practices/rules/config.md)
    # para explicar por qué NO hay que hacerlo. Valores de manual, no secretos.
    '''\.agents/skills/''',
    '''(^|/)docs/''',
    '''(^|/)tests/''',
    '''\.env\.example$''',
    # Entornos virtuales de Python que quedaron dentro del repo: es código de
    # terceros, y sus cadenas de ejemplo no son secretos de este proyecto.
    '''(^|/)\.?[a-z-]*venv/''',
    '''(^|/)node_modules/''',
]
